services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    volumes:
      - ./images:/app/images:ro
    environment:
      PORT: 8080
      WEB_STATIC_DIR: /app/static
      WEB_AUTH_ENABLED: ${WEB_AUTH_ENABLED:-0}
      WEB_USERNAME: ${WEB_USERNAME:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      RESEARCH_URL: http://research:8000/research
      SECURITY_URL: http://security:8000/assess
      FACT_CHECK_URL: http://fact-check:8000/process
      SOURCE_QUALITY_URL: http://source-quality:8000/process
      PRIVACY_REVIEW_URL: http://privacy-review:8000/process
      SYNTHESIS_URL: http://synthesis:8000/process
      PIXEL_URL: http://pixel:8000/process
      # Slide-deck generation (Pixel). True while the feature is being tested; set it to false in
      # compose and .env when the feature is done so no request spends model calls on decks.
      VIHARBOT_PPT_GENERATION_ENABLED: ${VIHARBOT_PPT_GENERATION_ENABLED:-true}
      # Optional coordination modes. All off by default; iterative mode needs all three.
      VIHARBOT_IDENTITY_ROUTING_ENABLED: ${VIHARBOT_IDENTITY_ROUTING_ENABLED:-false}
      VIHARBOT_DELEGATION_ENABLED: ${VIHARBOT_DELEGATION_ENABLED:-false}
      VIHARBOT_ITERATIVE_ORCHESTRATION_ENABLED: ${VIHARBOT_ITERATIVE_ORCHESTRATION_ENABLED:-false}
      # Dev only: planner rationale and model aliases in the live stream. Off by default.
      VIHARBOT_DEV_DIAGNOSTICS_ENABLED: ${VIHARBOT_DEV_DIAGNOSTICS_ENABLED:-false}
      # Charlie's planner is the only inference the web service makes. It stays unavailable
      # until an alias is set on purpose, and the key is passed only through the opt-in
      # WEB_LITELLM_API_KEY so the browser-facing container holds no key by default.
      CHARLIE_PLANNER_MODEL: ${CHARLIE_PLANNER_MODEL:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${WEB_LITELLM_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      research:
        condition: service_healthy
      security:
        condition: service_healthy
      fact-check:
        condition: service_healthy
      source-quality:
        condition: service_healthy
      privacy-review:
        condition: service_healthy
      synthesis:
        condition: service_healthy
      pixel:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  research:
    build:
      context: .
      dockerfile: Dockerfile.research
    environment:
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      RESEARCH_MODEL: ${RESEARCH_MODEL:-openai/gpt-5.4-mini}
      MEMORY_DIR: /data
    volumes:
      - ./data/research:/data/research
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  security:
    build:
      context: .
      dockerfile: Dockerfile.security
    environment:
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      SECURITY_MODEL: ${SECURITY_MODEL:-openai/gpt-5.4}
      MEMORY_DIR: /data
    volumes:
      - ./data/security:/data/security
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  fact-check:
    build:
      context: .
      dockerfile: Dockerfile.specialist
    environment:
      AGENT_KIND: fact-check
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      FACT_CHECK_MODEL: ${FACT_CHECK_MODEL:-gemini/gemini-3.5-flash}
      MEMORY_DIR: /data
    volumes:
      - fact_check_data:/data
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  source-quality:
    build:
      context: .
      dockerfile: Dockerfile.specialist
    environment:
      AGENT_KIND: source-quality
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      SOURCE_QUALITY_MODEL: ${SOURCE_QUALITY_MODEL:-gemini/gemini-3.5-flash}
      MEMORY_DIR: /data
    volumes:
      - source_quality_data:/data
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  privacy-review:
    build:
      context: .
      dockerfile: Dockerfile.specialist
    environment:
      AGENT_KIND: privacy-review
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      PRIVACY_MODEL: ${PRIVACY_MODEL:-openai/gpt-5.4-mini}
      MEMORY_DIR: /data
    volumes:
      - privacy_review_data:/data
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  synthesis:
    build:
      context: .
      dockerfile: Dockerfile.specialist
    environment:
      AGENT_KIND: synthesis
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-openai/gpt-5.4-mini}
      MEMORY_DIR: /data
    volumes:
      - synthesis_data:/data
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pixel:
    build:
      context: .
      dockerfile: Dockerfile.pixel
    environment:
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      PIXEL_MODEL: ${PIXEL_MODEL:-gemini/gemini-3.5-flash}
      # The service refuses to run unless this is true. Same switch as the web service.
      VIHARBOT_PPT_GENERATION_ENABLED: ${VIHARBOT_PPT_GENERATION_ENABLED:-true}
      # Budgets for one deck: slides planned and the hard cap on model calls.
      PIXEL_TARGET_SLIDES: ${PIXEL_TARGET_SLIDES:-6}
      PIXEL_MAX_MODEL_CALLS: ${PIXEL_MAX_MODEL_CALLS:-8}
      MEMORY_DIR: /data
    volumes:
      - pixel_data:/data
    expose:
      - "8000"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  orchestrator:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    environment:
      RESEARCH_URL: http://research:8000/research
      SECURITY_URL: http://security:8000/assess
      FACT_CHECK_URL: http://fact-check:8000/process
      SOURCE_QUALITY_URL: http://source-quality:8000/process
      PRIVACY_REVIEW_URL: http://privacy-review:8000/process
      SYNTHESIS_URL: http://synthesis:8000/process
      RESEARCH_QUESTION: ${RESEARCH_QUESTION:-Summarize general safety practices for bicycle maintenance.}
    depends_on:
      research:
        condition: service_healthy
      security:
        condition: service_healthy
      fact-check:
        condition: service_healthy
      source-quality:
        condition: service_healthy
      privacy-review:
        condition: service_healthy
      synthesis:
        condition: service_healthy
    networks:
      - agent-network

  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      MEMORY_DIR: /tmp/viharbot-test-memory
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm.viharchokshi.com}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      RESEARCH_MODEL: ${RESEARCH_MODEL:-}
      SECURITY_MODEL: ${SECURITY_MODEL:-}
      RUN_LITELLM_INTEGRATION: ${RUN_LITELLM_INTEGRATION:-0}
      RUN_LITELLM_INFERENCE: ${RUN_LITELLM_INFERENCE:-0}
    networks:
      - agent-network

networks:
  agent-network:
    name: viharbot-agent-network
    driver: bridge

volumes:
  fact_check_data:
  source_quality_data:
  privacy_review_data:
  synthesis_data:
  pixel_data:
