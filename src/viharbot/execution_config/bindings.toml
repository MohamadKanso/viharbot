# Approved execution bindings: which existing operational service fulfills a capability on
# behalf of an identity. These describe orchestration responsibility only. The service keeps
# its own system prompt, model alias and permissions; the identity's personality prompt is
# not used. Editing this file is the only way to change bindings.

[[binding]]
identity_id = "nova"
capability = "research"
service_name = "research"

[[binding]]
identity_id = "scout"
capability = "fact_check"
service_name = "fact-check"

[[binding]]
identity_id = "scout"
capability = "source_quality"
service_name = "source-quality"

[[binding]]
identity_id = "cipher"
capability = "security_assessment"
service_name = "security"

[[binding]]
identity_id = "cipher"
capability = "privacy_review"
service_name = "privacy-review"

[[binding]]
identity_id = "charlie"
capability = "synthesis"
service_name = "synthesis"

# Pixel's slide generation. Unlike the six services above, the pixel service is not a stage of
# the typed pipeline: the web service calls it after the pipeline, only when the PPT flag is on.
[[binding]]
identity_id = "pixel"
capability = "slide_generation"
service_name = "pixel"

# Sage's philosophical analysis. An optional capability of the live loop: Charlie may delegate it
# once research exists; it reads the other agents' results and never gates completion.
[[binding]]
identity_id = "sage"
capability = "philosophical_analysis"
service_name = "sage"
